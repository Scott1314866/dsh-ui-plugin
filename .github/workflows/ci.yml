name: Plugin validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.2.1-rc.2, 0.2.1-rc.3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        if: matrix.dsh == '0.2.1-rc.3'
      - run: node scripts/test-compat-version.mjs
        if: matrix.dsh == '0.2.1-rc.2'
        env:
          XIEN_DSH_TEST_VERSION: ${{ matrix.dsh }}
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run check:package
      - run: npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: xien-dsh-ui-plugin-${{ matrix.dsh }}
          path: artifacts/*.tgz
